<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modelo de Caixa</title>
  <style>
     h1 {
       display: flex;
       height:300px;
       width:300px;                                     
       background-color: rgb(175, 169, 169);
       border-width: 10px;
       border-style: solid; 
       border-color: rgb(36, 75, 75);
       

       padding: 10px 20px;
       margin: 40px 50px;
       outline: 10px dashed salmon; 

     }

     a{
         display:block;                                      
         border-style: dashed;
         border-color: blue;
         border-width: 2px;
         padding: 5px;
     }



  </style>

</head>

<body>
  <h1>Exemplo de Caixa box-level</h1>
  <p>Páragrafo também são exemplos de box-level, mas os <a href="">links são exemplos de caixas inline-level</a> Vamos ver como tudo isso funciona</p>
