<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exemplo de Hover</title>

<style>
          body{ 
            font-family: Arial, Helvetica, sans-serif; 
          }  
          

          div > p{
            display: none;
            color: rgb(246, 243, 249);
             background-color: rgb(23, 20, 20);
             width: 200px;
             height: 50px;
             text-align: center;
             
          }

          div:hover > p{
           display: block;
          
          }

          div:hover{
             color: red;
             
          }

</style>

</head>
<body>
        <h1>Exemplo de Hover</h1>
        <p>Passe o mouse sobre o texto abaixo</p>    
        <div>Passe o mouse aqui
         <p>Texto Escondido</p>
        </div>                                      


</body>
</html>
