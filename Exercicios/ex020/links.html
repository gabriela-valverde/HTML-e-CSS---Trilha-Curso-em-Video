<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Links</title>



<style>

/*pseudo classe define o estado dos elemento sn no css*/  

    /* # id
       . class
       : pseudo-classe
       :: pseudo-elemnento
       >  filho b*/

    body{
      font-family: Arial, Helvetica, sans-serif;

    }


    a{
      color: red;
       text-decoration: none;
    }

    a:visited{
      color: rgb(31, 208, 18);
     
    }

    a:hover{
     color: black;
    }

    a:active{
     color: yellow;
    }
 
    
     a::before{
      content: '\0027F8' ;
     }


    a::after  /*depois de todos os links - pseudo elmento*/ 
      {
        content: '\0027F9';
      }
   /*pseudo elementos*/

</style>


</head>
<body>

<h1>Personalizando links</h1>   
<ul>
  
  <li><a href="https://github.com/gabriela-valverde" target="_blank">Repositório GitHub</a></li>
  <li><a href="https://www.youtube.com/@Gabi-f5m4s"  target="_blank">Canal do Youtube</a></li>
  <li><a href="https://www.cursoemvideo.com/minha-conta/"  target="_blank">Site do Curso em Video</a></li>
</ul>

</body>
</html>
