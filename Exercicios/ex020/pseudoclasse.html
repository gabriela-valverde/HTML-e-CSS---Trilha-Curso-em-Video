<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="stylo.css}">

<style>
   li{
      display: inline-block; /*a div inteira fica organizada com essa tag*/
      background-color: blue;
      border: 1px solid black;
      height: 100px; /*altura */
      width: 100px;  /*largura*/   
      text-align: center;                                       
   }
   
  li:hover{
      background-color: chartreuse; /*passa o mouse no iten e deixa ele com outra cor*/
   }

</style>

<title>Pseudo Calsse</title>


</head>
<body>
<ul>
   <li>01</li>
   <li>02</li>
   <li>03</li>
</ul>

</body>
